name: blueprint

on:
  pull_request:
    paths:
      - 'ARCHITECTURE.md'
      - 'research/**'
      - 'tasks/**'
      - 'docs/expansion/**'
      - 'tools/verify_blueprint.py'
      - '.github/workflows/blueprint.yml'
  push:
    branches: [main]
    paths:
      - 'ARCHITECTURE.md'
      - 'research/**'
      - 'tasks/**'
      - 'docs/expansion/**'
      - 'tools/verify_blueprint.py'
      - '.github/workflows/blueprint.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/verify_blueprint.py
