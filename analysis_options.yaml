# Static analysis for Tavli. `flutter analyze` must report no issues.
# See docs/flutter-best-practices.md for the reasoning behind these rules.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - macos/**
    - "**/*.g.dart"
    # Preuzet tuđi kod kao referenca (docs/expansion), nije deo aplikacije.
    - research/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Async mistakes and context-after-await are bugs, not style.
    unawaited_futures: error
    discarded_futures: error
    use_build_context_synchronously: error
    avoid_print: error

linter:
  rules:
    # Types and declarations
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_types_on_closure_parameters
    - type_annotate_public_apis
    - prefer_final_locals
    - prefer_final_fields
    - prefer_final_in_for_each
    - unnecessary_lambdas
    - unnecessary_parenthesis

    # Const and widgets
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box
    - sort_child_properties_last

    # Async
    - unawaited_futures
    - discarded_futures
    - avoid_void_async
    - use_build_context_synchronously

    # Errors
    - only_throw_errors
    - avoid_catches_without_on_clauses
    - avoid_catching_errors
    - avoid_returning_null_for_void
    - cancel_subscriptions
    - close_sinks

    # Style and hygiene
    - avoid_print
    - directives_ordering
    - prefer_single_quotes
    - require_trailing_commas
    - unnecessary_statements
    - use_super_parameters
    - avoid_redundant_argument_values
    - avoid_unused_constructor_parameters
    - comment_references
    - depend_on_referenced_packages
    - noop_primitive_operations
